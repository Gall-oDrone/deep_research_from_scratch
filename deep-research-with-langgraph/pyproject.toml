[project]
name = "deep-research-with-langgraph"
version = "0.1.0"
description = "Deep Research with LangGraph - Course materials and examples"
authors = [
    {name = "Course Student", email = "student@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint>=2.0.0",
    "langgraph-sdk>=0.1.0",
    "tavily-python>=0.2.0",
    "duckduckgo-search>=4.1.0",
    "arxiv>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "ipykernel>=6.0.0",
    "tiktoken>=0.7.0",
    "tenacity>=8.5.0",
    "tqdm>=4.66.0",
    "rich>=13.0.0",
    "langsmith>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "isort>=5.12.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88
