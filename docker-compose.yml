version: '3.8'

services:
  deep-research:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deep-research-notebook
    ports:
      - "8888:8888"
    volumes:
      # Mount notebooks for live editing
      - ./notebooks:/app/notebooks:rw
      # Mount source code for development
      - ./src:/app/src:rw
      # Mount data directory
      - ./data:/app/data:rw
      # Mount environment file if it exists
      - ./.env:/app/.env:ro
    environment:
      # Jupyter settings
      - JUPYTER_ENABLE_LAB=no
      - JUPYTER_TOKEN=
      - JUPYTER_PASSWORD=
      # Pass through API keys from host environment or .env file
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-deep_research_from_scratch}
    working_dir: /app
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - research-network

networks:
  research-network:
    driver: bridge
